name: Monitor de menções em vídeo (YouTube)

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas (lives ganham legenda horas depois)
  workflow_dispatch:
    inputs:
      dias:
        description: "Idade máxima dos vídeos, em dias"
        default: "3"

permissions:
  contents: write

concurrency:
  group: monitor-midia
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2   # runtime JavaScript exigido pelo yt-dlp para o YouTube
        with:
          deno-version: v2.x

      - name: Instalar dependências (yt-dlp sempre na versão mais nova)
        run: pip install -U -r monitor_midia/requirements.txt

      - name: Cookies do YouTube (opcional, só se o secret existir)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Procurar menções
        run: python monitor_midia/monitorar.py --dias "${{ inputs.dias || '3' }}"

      - name: Registrar resultados
        if: always()
        run: |
          git config user.name "monitor-midia"
          git config user.email "monitor-midia@users.noreply.github.com"
          git add monitor_midia/estado.json monitor_midia/mencoes.csv monitor_midia/relatorios 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Monitor de mídia: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash -X theirs origin main
            git push
          fi
